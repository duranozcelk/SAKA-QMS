services:
  - type: web
    name: saka-qms-backend
    env: python
    region: frankfurt  # EU bölgesi, Türkiye'ye yakın
    plan: free
    branch: main
    rootDir: backend  # Backend klasörünü root olarak belirt
    buildCommand: "pip install -r requirements.txt"  # Artık backend klasöründe olduğumuz için
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"  # cd backend gereksiz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"  # Major.Minor.Patch formatında olmalı
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173"  # Vercel URL'inizi deployment sonrası ekleyin
    healthCheckPath: /health
